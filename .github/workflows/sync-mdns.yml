# Check for upstream filesync mdns.lua updates weekly.
# Opens a PR if the submodule ref has updated.
name: Sync mdns.lua

on:
  schedule:
    - cron: "0 6 * * 1"   # Every Monday at 06:00 UTC
  workflow_dispatch:       # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update filesync submodule and sparse-checkout
        run: bash sync-mdns.sh master

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet .submodules/filesync-koplugin lib/mdns.lua; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update filesync submodule (mdns.lua)"
          title: "chore: update filesync submodule (mdns.lua)"
          body: |
            Automated update of `.submodules/filesync-koplugin` from
            [filesync.koplugin](https://github.com/abrahamnm/filesync.koplugin).

            Please review the diff and test on-device before merging.
          branch: auto/sync-mdns
          delete-branch: true
