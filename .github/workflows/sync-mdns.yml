# Check for upstream mdns.lua updates weekly.
# Opens a PR if the submodule ref has updated.
name: Sync mdns.lua

on:
  schedule:
    - cron: "0 6 * * 1"   # Every Monday at 06:00 UTC
  workflow_dispatch:       # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Load environment variables from .env
        run: cat .env >> "$GITHUB_ENV"

      - name: Update submodule and sparse-checkout
        run: bash sync-mdns.sh "${DEFAULT_REF}"

      - name: Check for changes
        id: diff
        run: |
          TARGET_FILE="${LIB_DIR}/$(basename "${UPSTREAM_FILE}")"
          if git diff --quiet "${SUBMODULE_DIR}" "${TARGET_FILE}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update submodule (${{ env.UPSTREAM_FILE }})"
          title: "chore: update submodule (${{ env.UPSTREAM_FILE }})"
          body: |
            Automated update of `${{ env.SUBMODULE_DIR }}` from
            ${{ env.UPSTREAM_REPO }}.

            Please review the diff and test on-device before merging.
          branch: auto/sync-submodule
          delete-branch: true
